<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180" fill="none">
  <!-- iOS 홈 화면용: 180x180. iOS 가 자동으로 둥근 모서리 적용하므로 square 배경 OK.
       favicon 보다 디테일 더 가능. -->
  <rect width="180" height="180" fill="#0c0c0c"/>
  <!-- 가운데 Q -->
  <g transform="translate(90 96)">
    <!-- 본체 원 -->
    <ellipse cx="0" cy="0" rx="42" ry="52" stroke="#b8935a" stroke-width="6" fill="none"/>
    <!-- 내부 hairline -->
    <ellipse cx="0" cy="0" rx="24" ry="32" stroke="#b8935a" stroke-width="1" fill="none" opacity="0.35"/>
    <!-- flourish 꼬리 (Q 아래 오른쪽으로 흐르는 serif tail) -->
    <path
      d="M 18 36 Q 48 60 70 52 Q 60 68 24 56 Z"
      fill="#b8935a"
    />
  </g>
  <!-- 하단 brand wordmark (subtle) -->
  <text
    x="90"
    y="158"
    text-anchor="middle"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="11"
    font-style="italic"
    letter-spacing="2"
    fill="#b8935a"
    opacity="0.6"
  >Q · ATELIER</text>
</svg>
